<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Nexus Pro</title>
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- ── Home-Bildschirm-Icon & "Wie eine App" (iOS/Android) ─────────── -->
<!-- iOS: Icon fürs Hinzufügen zum Home-Bildschirm -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<!-- iOS: im Vollbild wie eine echte App starten (ohne Safari-Leiste) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus Pro">
<!-- Browser-Tab-Icon (Favicon) -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<!-- Android/Chrome: "Zum Startbildschirm hinzufügen" -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080b16">
<!-- ─────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Schriften blockierten bisher das erste Bild: der Browser wartete auf
     Googles Antwort, bevor er irgendetwas zeichnete. Jetzt wird das
     Stylesheet nebenher geladen und erst beim Eintreffen aktiv. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<style>
  :root{
    color-scheme: dark;
    --bg-0:#080b16;
    --bg-1:#0c1226;
    --bg-2:#121a36;
    --surface:#141d3b;
    --surface-2:#182247;
    --bubble-in:#161f40;
    --bubble-out-a:#5b6ef5;
    --bubble-out-b:#8c5cff;
    --border:#242e56;
    --accent-a:#5b6ef5;
    --accent-b:#8c5cff;
    --accent-c:#34d8c4;
    --text:#e9edfb;
    --text-muted:#8c96b8;
    --danger:#ff5c72;
    --essen:#ff6b6b;
    --muelheim:#4ade80;

    /* Bewegungs-Tokens: eine einheitliche Kurve statt gemischtem "ease".
       "ease" ist die Browser-Standardkurve und wirkt genau deshalb billig. */
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-std: cubic-bezier(.32,.72,0,1);
    --dur-fast: 140ms;
    --dur-mid: 260ms;
    --dur-slow: 520ms;

    /* Radien-System */
    --r-xs: 12px;
    --r-sm: 14px;
    --r-md: 18px;
    --r-lg: 28px;
    --r-tail: 6px;
    --r-full: 999px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    height: 100%;
    height: 100dvh;
    min-height: 100%;
    min-height: 100dvh;
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    background-color: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .ambient{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  }

  .ambient::after{
    content:"";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(91,110,245,0.28), transparent 62%);
    opacity: 0;
    transition: opacity .7s var(--ease-out);
  }

  .ambient.pulse::after{ opacity: 1; }

  .starfield{
    position: absolute;
    inset: 0;
  }

  /* Der Puls lief frueher als filter: brightness() ueber das gesamte
     Sternenfeld — das ist der teuerste Paint der Datei. Jetzt uebernimmt
     eine zweite, reine Opacity-Ebene den Effekt. */
  .ambient::before{
    content:"";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(140,92,255,0.16), transparent 58%);
    opacity: 0;
    transition: opacity .7s var(--ease-out);
  }

  .ambient.pulse::before{ opacity: 1; }

  .star{
    position: absolute;
    border-radius: 50%;
    animation: drift-star var(--dur) ease-in-out infinite alternate, twinkle-star var(--tw) ease-in-out infinite;
  }

  /* Im Hintergrund kostet der Sternenhimmel sonst weiter Rechenzeit. */
  .starfield.paused .star{ animation-play-state: paused; }

  @keyframes drift-star{
    from{ transform: translate(0, 0); }
    to{ transform: translate(var(--dx), var(--dy)); }
  }

  @keyframes twinkle-star{
    0%, 100%{ opacity: var(--op-min); }
    50%{ opacity: var(--op-max); }
  }

  .app{
    height: 100vh;
    height: 100dvh;
    height: calc(100dvh - var(--kb, 0px));
    display:flex;
    flex-direction:column;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    transform: translateY(var(--vh-offset, 0px));
    /* Stand 15.08.: "interactive-widget=resizes-content" (unten im
       viewport-meta) wird von iOS Safari / der installierten Home-
       Bildschirm-App NICHT zuverlaessig beachtet -- live getestet: die
       Tastatur oeffnet sich, .app bleibt aber ueber volle 100dvh stehen
       und der Composer landet unsichtbar dahinter. Deshalb zieht --kb
       (siehe kbMessen() unten, ueber visualViewport gemessen) hier wieder
       aktiv von der App-Hoehe ab -- das ist der zuverlaessige Teil, der
       auf jedem iOS-Geraet unabhaengig von Safari-Version funktioniert.
       Auf Browsern, die interactive-widget bereits nativ resizen (z. B.
       Chrome/Android), schrumpft die visualViewport-Hoehe im selben Zug
       wie 100dvh mit -- dort bleibt --kb bei 0, keine Doppel-Kompensation.
       "contain: layout" haelt das Neu-Layout auf .app beschraenkt, .chat
       selbst (flex:1) muss dabei nur seine eigene Hoehe anpassen, nicht
       jede Nachricht einzeln neu berechnen -- die Transition unten bleibt
       dadurch trotz Layout-Eigenschaft (height) bezahlbar. */
    transition: height .3s var(--ease-out);
    contain: layout;
  }

  .watermark{
    position:absolute;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity .5s var(--ease-out);
  }

  .watermark.show{ opacity: 1; }

  .watermark span{
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.14em;
    line-height: 1;
    color: transparent;
    background: linear-gradient(135deg, rgba(91,110,245,0.16), rgba(140,92,255,0.13) 50%, rgba(52,216,196,0.12));
    -webkit-background-clip: text;
    background-clip: text;
    white-space: nowrap;
    user-select: none;
  }

  @media (max-width: 420px){
    .watermark span{ font-size: 24px; }
  }

  /* ── Header ───────────────────────────────── */
  .header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding: 18px 20px;
    padding-top: max(18px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    position: relative;
    z-index: 1;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .6s var(--ease-out), transform .6s cubic-bezier(.2,.8,.2,1);
  }

  .header.show{
    opacity: 1;
    transform: translateY(0);
  }

  .notif-btn{
    margin-left: auto;
    position: relative;
    width: 38px; height:38px;
    border-radius: 12px;
    border: none;
    background: var(--surface);
    color: var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    cursor: pointer;
    transition: background .15s var(--ease-out), color .15s var(--ease-out);
  }

  .notif-btn:active{ transform: scale(0.94); }

  .notif-btn.granted{
    color: var(--accent-c);
    background: rgba(52,216,196,0.12);
  }

  .notif-btn svg{ width:19px; height:19px; }

  .notif-dot{
    position: absolute;
    top: 6px; right: 7px;
    width: 7px; height:7px;
    border-radius: 50%;
    background: var(--danger);
    display: none;
  }

  .notif-btn.needs-attention .notif-dot{ display: block; }

  /* Refresh-Button reiht sich rechts hinter Glocke + Muelltonne ein
     (Muelltonne wird von nexus-sync.js zur Laufzeit direkt hinter
     #notifBtn eingefuegt -- landet also automatisch VOR diesem Button).
     Kein eigenes margin-left:auto noetig, das uebernimmt schon die
     Glocke fuer die ganze rechte Gruppe; margin-left hier nur fuer den
     gleichen Abstand wie zwischen Glocke und Muelltonne (siehe .nx-trash
     in nexus-sync.js). */
  .refresh-btn{ margin-left: 8px; }

  .refresh-btn svg{ transition: transform .15s var(--ease-out); }

  /* Laeuft waehrend des Nachladens, reuse der schon vorhandenen
     @keyframes spin (siehe .spinner) statt einer zweiten Animation. */
  .refresh-btn.loading svg{ animation: spin .6s linear infinite; }

  .logo-mark{
    width:34px; height:34px;
    border-radius: var(--r-xs);
    background: #0c1226;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    position: relative;
  }

  /* Frueher ein animierter box-shadow — der zwingt den Browser in jedem
     Frame zum Neuzeichnen des Blurs. Jetzt liegt der Schein als fertiger
     Verlauf darunter und nur opacity/scale animieren (reiner Compositor). */
  .logo-mark::before{
    content:"";
    position: absolute;
    left: 50%; top: 58%;
    width: 190%; height: 190%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(140,92,255,0.55) 0%, rgba(91,110,245,0.28) 42%, transparent 68%);
    opacity: .55;
    pointer-events: none;
    z-index: -1;
    animation: breathe-glow 4.5s ease-in-out infinite;
  }

  @keyframes breathe-glow{
    0%, 100%{ opacity: .45; transform: translate(-50%, -50%) scale(0.92); }
    50%{ opacity: .9; transform: translate(-50%, -50%) scale(1.08); }
  }

  .logo-mark svg{ width:100%; height:100%; display:block; }

  .core-glow{
    animation: core-glow-pulse 4.5s ease-in-out infinite;
    transform-origin: 80px 80px;
  }
  @keyframes core-glow-pulse{
    0%, 100%{ opacity: 0.6; transform: scale(1); }
    50%{ opacity: 1; transform: scale(1.15); }
  }

  .brand{
    font-family:'Sora', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .brand-pro{
    font-family:'Sora', sans-serif;
    font-size: 0.5em;
    font-weight: 800;
    letter-spacing: 0.05em;
    vertical-align: super;
    margin-left: 3px;
    background: linear-gradient(90deg, var(--accent-c), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .status-line{
    font-size: 12px;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:1px;
  }

  .status-line .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--accent-c);
    box-shadow: 0 0 6px 1px rgba(52,216,196,0.7);
  }

  /* ── Chat area ────────────────────────────── */
  .chat{
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    position: relative;
    z-index: 1;
    /* scroll-behavior: smooth stand hier global und hat sich mit dem
       eigenen Scroll-Kleben gebissen — daher das Haken-und-Springen.
       Weiches Scrollen wird jetzt gezielt im Code ausgeloest. */
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.12) transparent;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    /* Frueher hier zusaetzlich "calc(12px + var(--kb,0px))" fuer die
       Tastatur -- jetzt schrumpft .app selbst nativ mit der Tastatur
       (siehe dort), .chat (flex:1) bekommt seine kleinere Hoehe also
       automatisch. Ein zusaetzliches Tastatur-Padding wuerde die
       Verkleinerung doppelt zaehlen und unten unnoetig Platz freilassen. */
    padding-bottom: 12px;
  }

  .chat::-webkit-scrollbar{ width: 5px; }
  .chat::-webkit-scrollbar-track{ background: transparent; }
  .chat::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.08); border-radius: 4px; }

  .row{
    display:flex;
    max-width: 84%;
    /* Der lange Druck oeffnet unser eigenes Menue. iOS feuert dabei kein
       "selectstart", weshalb die JS-Bremse in nexus-sync.js wirkungslos
       war und zusaetzlich die native Auswahl aufzog — sichtbar als blaue
       Markierung ueber die ganze Seite plus zweitem Systemmenue.
       Kopieren laeuft ueber den eigenen Knopf im Menue. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    animation: materialize .4s var(--ease-out) both;
    /* Jede Bubble bekommt ihren eigenen Layout- und Paint-Bereich.
       Dadurch reflowt beim Tastatur-Oeffnen nicht die ganze Liste neu. */
    contain: content;
  }

  @keyframes materialize{
    0%{ opacity: 0; transform: translateY(14px) scale(0.94); }
    60%{ opacity: 1; }
    100%{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .row.out{ align-self:flex-end; justify-content:flex-end; }
  .row.in{ align-self:flex-start; justify-content:flex-start; }

  .bubble{
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap:break-word;
    white-space: pre-wrap;
  }

  .row.out .bubble{
    background: linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .row.in .bubble{
    background: var(--bubble-in);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 6px;
  }

  .bubble.audio-bubble{
    padding: 10px 14px;
  }

  .voice-player{
    display:flex;
    align-items:center;
    gap:11px;
    min-width: 190px;
  }

  .voice-play-btn{
    flex-shrink:0;
    width: 34px; height:34px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.18);
    color:#fff;
    box-shadow: 0 2px 8px -2px rgba(0,0,0,0.35);
    transition: background .15s var(--ease-out), transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s var(--ease-out);
  }

  .voice-play-btn:hover{ background: rgba(255,255,255,0.28); }
  .voice-play-btn:active{ transform: scale(0.9); }
  .voice-play-btn svg{ width:13px; height:13px; }

  .row.in .voice-play-btn{
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 3px 10px -3px rgba(91,110,245,0.55);
  }

  .voice-wave{
    flex:1;
    display:flex;
    align-items:center;
    gap:2.5px;
    height: 28px;
    cursor:pointer;
  }

  .voice-wave span{
    flex:1;
    min-width: 2.5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.32);
    transition: background .25s var(--ease-out), transform .2s var(--ease-out);
    transform-origin: center;
  }

  .voice-wave:hover span{ transform: scaleY(1.08); }

  .row.in .voice-wave span{ background: rgba(255,255,255,0.14); }
  .row.in .voice-wave span.played{ background: linear-gradient(180deg, var(--accent-c), var(--accent-a)); }
  .row.out .voice-wave span.played{ background: #ffffff; }

  .voice-duration{
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
    flex-shrink:0;
    min-width: 32px;
    text-align:right;
    letter-spacing: 0.2px;
  }

  .meta{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top: 4px;
    padding: 0 4px;
  }

  .row.out .meta{ justify-content:flex-end; }

  .timestamp{
    font-size: 11px;
    color: var(--text-muted);
  }

  .ticks{
    display:flex;
    align-items:center;
    color: var(--text-muted);
    line-height:0;
    transition: color .25s var(--ease-out);
  }

  .ticks .check-2{
    opacity: 0;
    transition: opacity .25s var(--ease-out);
  }

  .ticks.confirmed{ color: var(--accent-c); }
  .ticks.confirmed .check-2{ opacity: 1; }

  .typing{
    display:flex;
    gap:4px;
    padding: 14px 16px;
  }

  .typing span{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2){ animation-delay: .15s; }
  .typing span:nth-child(3){ animation-delay: .3s; }

  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:.5; }
    30%{ transform: translateY(-4px); opacity:1; }
  }

  .empty-state{
    margin: auto;
    text-align:center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 40px 20px;
    line-height: 1.6;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity .65s var(--ease-out), transform .65s cubic-bezier(.2,.8,.2,1);
  }

  .empty-state.show{
    opacity: 1;
    transform: scale(1);
  }

  .empty-state .logo-mark{
    margin: 0 auto 16px;
    width: 48px; height:48px;
    border-radius: 14px;
  }

  .empty-state strong{
    display:block;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    margin-bottom: 6px;
  }

  /* ── Composer ─────────────────────────────── */
  .composer-wrap{
    flex-shrink:0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    position: relative;
    z-index: 1;
    opacity: 0;
    /* Nur noch der einmalige Intro-Versatz beim ersten Laden (24px,
       faellt mit .show auf 0). Die Tastatur braucht hier keine eigene
       Kompensation mehr -- .app schrumpft jetzt nativ (siehe dort), der
       Composer landet als letztes Flex-Kind von ganz allein oberhalb
       der Tastatur, ohne eigenen Transform-Hack. */
    transform: translateY(24px);
    transition: opacity .55s var(--ease-out), transform .55s var(--ease-out);
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    will-change: transform;
  }

  .composer-wrap.show{
    opacity: 1;
    transform: translateY(0);
  }

  .app.kb-open .composer-wrap{
    padding-bottom: 6px;
  }

  /* Bewusst gestaltete Übergangszone zur Tastatur hin — im Marken-Look
     (statt neutralem Grau), nur sichtbar solange die Tastatur offen ist. */
  .composer-wrap::after{
    content:"";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 26px;
    background: linear-gradient(180deg, transparent 0%, rgba(20,29,59,0.85) 70%, rgba(18,26,54,0.95) 100%);
    opacity: 0;
    transition: opacity .38s var(--ease-out);
    pointer-events: none;
    z-index: -1;
  }

  .app.kb-open .composer-wrap::after{
    opacity: 1;
  }

  .attachment-chip{
    display:none;
    align-items:center;
    gap:10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px 8px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .attachment-chip.show{ display:flex; }

  .attachment-chip .voice-play-btn{
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  }

  .attachment-chip .voice-wave span{ background: rgba(255,255,255,0.14); }
  .attachment-chip .voice-wave span.played{ background: var(--accent-c); }
  .attachment-chip .voice-duration{ color: var(--text-muted); }

  .chip-remove{
    width: 24px; height:24px;
    border-radius:50%;
    border:none;
    background: rgba(255,92,114,0.12);
    color: var(--danger);
    font-size: 14px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }

  .composer{
    display:flex;
    align-items:flex-end;
    gap:6px;
    position: relative;
    border-radius: 28px;
    padding: 7px 7px 7px 20px;
    background: rgba(20,29,59,0.94);
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px -16px rgba(91,110,245,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
    transition: box-shadow .25s var(--ease-out), border-color .25s var(--ease-out);
  }

  /* Der Blur lag ueber dem animierten Sternenfeld und musste deshalb bei
     JEDEM Sternen-Frame neu berechnet werden. Auf Zeigergeraeten (Desktop)
     bleibt er, auf dem Handy uebernimmt eine leicht deckendere Flaeche. */
  @media (hover: hover) and (pointer: fine){
    .composer{
      background: rgba(20,29,59,0.7);
      backdrop-filter: blur(18px);
    }
  }

  .composer:focus-within{
    border-color: rgba(91,110,245,0.55);
    box-shadow:
      0 14px 44px -14px rgba(91,110,245,0.6),
      0 0 0 3px rgba(91,110,245,0.16),
      0 0 0 1px rgba(255,255,255,0.03) inset;
  }

  .notes-wrap{
    position: relative;
    flex: 1;
    display:flex;
    align-items:center;
    min-width: 0;
  }

  #notes{
    width: 100%;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    max-height: 120px;
    padding: 9px 0;
    caret-color: var(--accent-a);
  }

  #notes::placeholder{ color: #7683ad; }

  .notes-wrap.recording #notes{ display:none; }

  .record-live{
    display:none;
    align-items:center;
    gap:10px;
    width: 100%;
    padding: 9px 2px;
  }

  .notes-wrap.recording .record-live{ display:flex; }

  .rec-dot{
    flex-shrink:0;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--danger);
    animation: blink 1s step-start infinite;
  }

  .rec-time{
    flex-shrink:0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .rec-wave{
    flex:1;
    display:flex;
    align-items:center;
    gap:2px;
    height: 24px;
    overflow:hidden;
    min-width:0;
  }

  .rec-wave span{
    flex: 0 0 auto;
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent-c), var(--accent-a));
    height: 4px;
  }

  .icon-btn{
    flex-shrink:0;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    color: var(--text-muted);
    position: relative;
    transition: background .15s var(--ease-out), color .15s var(--ease-out), transform .15s var(--ease-out);
  }

  .icon-btn:hover{ background: rgba(255,255,255,0.05); color: var(--text); }
  .icon-btn:active{ transform: scale(0.92); }

  .icon-btn.mic.recording{
    color: #fff;
    background: linear-gradient(135deg, var(--danger), #ff8a5c);
  }

  .icon-btn.mic .ring{
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border: 2px solid rgba(255,92,114,0.55);
    opacity:0;
  }

  .icon-btn.mic.recording .ring{
    opacity:1;
    animation: pulse-ring 1.5s ease-out infinite;
  }

  @keyframes pulse-ring{
    0%{ transform: scale(0.85); opacity:.7; }
    70%{ transform: scale(1.5); opacity:0; }
    100%{ transform: scale(1.5); opacity:0; }
  }

  .icon-btn svg{ width:19px; height:19px; }

  .icon-btn.cancel-rec{
    display:none;
    color: var(--danger);
  }

  .icon-btn.cancel-rec.show{ display:flex; }

  .icon-btn.cancel-rec:hover{ background: rgba(255,92,114,0.1); }

  @keyframes blink{ 50%{ opacity:0; } }

  .send-btn{
    flex-shrink:0;
    width: 40px; height:40px;
    border-radius: 50%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color:#fff;
    box-shadow: 0 6px 16px -6px rgba(91,110,245,0.6);
    transition: transform .15s var(--ease-out), opacity .15s var(--ease-out);
  }

  .send-btn:hover{ transform: translateY(-1px); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }

  .send-btn svg{ width:17px; height:17px; margin-left:1px; }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* Fehlermeldungen erscheinen als normale Chat-Bubble (siehe addErrorBubble)
     statt als verschwindendes Banner — bleiben so an ihrer Stelle im
     Verlauf stehen, auch wenn man erst spaeter wieder hinschaut. */
  .row .bubble.error-bubble{
    background: rgba(255,92,114,0.14);
    border: 1px solid rgba(255,92,114,0.35);
    color: #ffc4cd;
  }

  .particle{
    position: fixed;
    contain: strict;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-c));
    pointer-events: none;
    z-index: 999;
    transform: translate(-50%, -50%);
    animation: particle-burst .6s ease-out forwards;
  }

  @keyframes particle-burst{
    0%{ transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 1; }
    100%{ transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* ── Intro: Explosion, aus der die App entsteht ── */
  #introOverlay{
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
  }

  .intro-bg{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    transition: opacity .8s var(--ease-out);
  }

  .intro-bg.hide{ opacity: 0; }

  .intro-particle{
    position: absolute;
    border-radius: 50%;
    transition: transform 1s cubic-bezier(.3,.7,.2,1), opacity 1s var(--ease-out);
  }

  .intro-core{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, var(--accent-c) 40%, transparent 75%);
    opacity: 0;
    transform: scale(0.3);
  }

  #introOverlay.charging .intro-core{
    animation: core-charge .55s ease-in-out infinite;
  }

  @keyframes core-charge{
    0%, 100%{ transform: scale(0.5); opacity: 0.5; }
    50%{ transform: scale(0.85); opacity: 0.95; }
  }

  #introOverlay.burst .intro-core{
    animation: core-bloom .7s cubic-bezier(.15,.8,.3,1) forwards;
  }

  @keyframes core-bloom{
    0%{ transform: scale(0.8); opacity: 1; }
    45%{ transform: scale(4.4); opacity: 1; }
    100%{ transform: scale(0.6); opacity: 0; }
  }

  .app{
    pointer-events: none;
  }

  .app.ready{
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .star, .ambient::after, .ambient::before, .core-glow{ animation: none !important; }
  }
</style>
</head>

<script>
  // ── Mobile Keyboard-Fix ─────────────────────────────────────
  // Stand 12.08.: Die Tastatur wird nicht mehr per JS/CSS nachgezogen.
  // .app nutzt jetzt natives 100dvh + viewport-meta
  // "interactive-widget=resizes-content" — der Browser schrumpft die App
  // selbst, exakt im Takt der echten Tastatur-Animation, ohne dass wir
  // messen oder raten muessen. Composer und .chat brauchen dafuer keine
  // eigene --kb-Kompensation mehr, siehe .composer-wrap / .chat oben.
  //
  // --vh und --kb werden hier trotzdem weiter berechnet und gesetzt
  // (verwendet u. a. fuer --vh-offset bei Safari-Toolbar-Bewegungen).
  // Falls interactive-widget auf einem aelteren WebKit mal nicht greift,
  // liegen die Werte also bereit, sind aktuell aber fuer die Composer-
  // Position selbst ungenutzt (keine CSS-Regel liest mehr --kb).
  //
  // Warum die alten Anlaeufe nicht reichten:
  // 1) App-Hoehe selbst per CSS-Transition animiert — Layout-Eigenschaft,
  //    jeder Frame reflowte die gesamte Chatliste.
  // 2) --kb + transform am Composer, pro Frame nachgezogen — sah live
  //    trotzdem ruckelig aus, weil iOS visualViewport erst kurz vor/nach
  //    Ende der echten Tastatur-Animation meldet, nicht kontinuierlich
  //    waehrenddessen. Keine Transition-Kurve kann Zwischenwerte
  //    nachzeichnen, die nie ankommen.
  const docEl = document.documentElement;
  let basisHoehe = 0;
  let letzteKb = -1;
  let letzterOffset = -1;
  let kbLoopId = 0;
  let kbLoopBis = 0;

  function fensterHoehe(){
    const vv = window.visualViewport;
    return vv ? vv.height : window.innerHeight;
  }

  function basisSetzen(){
    const h = Math.max(fensterHoehe(), window.innerHeight || 0);
    if (Math.abs(h - basisHoehe) < 2) return;
    basisHoehe = h;
    docEl.style.setProperty('--vh', (h * 0.01) + 'px');
  }

  // Einmal messen und schreiben. Bewusst nur bei echter Änderung, damit
  // wir nicht jeden Frame unnötig Style invalidieren.
  //
  // Stand 15.08. (Nachbesserung "zu abgehackt"): iOS meldet die echte
  // Tastaturhöhe während der Animation oft in 1-2 ungenauen Zwischen-
  // schritten, nicht in einem sauberen Rutsch. Frueher wurde jede dieser
  // Zwischenmeldungen SOFORT auf --kb geschrieben -- das hat die laufende
  // CSS-Transition mitten in der Bewegung neu gestartet, was sich wie ein
  // kleiner Ruckler/Hitch angefuehlt hat.
  //
  // Stand 15.08., zweite Korrektur (per Bildschirmaufnahme gefunden): Der
  // erste Debounce-Versuch hat den Timer bei JEDEM Frame neu gestartet,
  // solange der rohe Messwert vom zuletzt GESCHRIEBENEN Wert abwich -- das
  // ist praktisch immer der Fall, bis geschrieben wurde, und wurde alle
  // ~16ms erneut ausgeloest. Der Timer kam dadurch fast nie zum Zug,
  // sondern erst wenn die Mess-Schleife (kbVerfolgen) nach ihrem festen
  // Zeitfenster komplett stoppte -- das Ergebnis war ein Composer, der bis
  // zu ~1,5s nach dem Schliessen der Tastatur in der komprimierten Position
  // haengen blieb, bevor er nachtraeglich zurueckgesprungen ist.
  // Richtig: Der Timer wird nur zurueckgesetzt, wenn sich der Messwert seit
  // dem LETZTEN FRAME veraendert hat. Bleibt er unveraendert, laeuft ein
  // bereits laufender Timer einfach weiter und committet puenktlich nach
  // ~60ms -- unabhaengig davon, ob die Mess-Schleife danach noch weiterlaeuft.
  let kbRohWert = 0;
  let kbLetzterRohWert = -1;
  let kbCommitTimer = 0;

  function kbCommitJetzt(){
    clearTimeout(kbCommitTimer);
    kbCommitTimer = 0;
    if (kbRohWert !== letzteKb){
      letzteKb = kbRohWert;
      docEl.style.setProperty('--kb', kbRohWert + 'px');
    }
  }

  function kbMessen(sofort){
    const vv = window.visualViewport;
    const h = fensterHoehe();
    const offsetTop = vv ? vv.offsetTop : 0;
    // Tastaturhöhe = wie viel vom Fenster gerade verdeckt ist.
    let kb = Math.max(0, Math.round(basisHoehe - h - offsetTop));
    // Unter ~80 px ist es keine Tastatur, sondern die Adressleiste.
    if (kb < 80) kb = 0;
    kbRohWert = kb;
    if (sofort){
      kbCommitJetzt();
    } else if (kb !== kbLetzterRohWert){
      clearTimeout(kbCommitTimer);
      kbCommitTimer = setTimeout(kbCommitJetzt, 60);
    }
    kbLetzterRohWert = kb;
    const off = Math.round(offsetTop);
    if (off !== letzterOffset){
      letzterOffset = off;
      docEl.style.setProperty('--vh-offset', off + 'px');
    }
    return kb;
  }

  // Während die native Tastatur fährt, jeden Frame nachziehen. iOS gibt
  // uns kein Fortschritts-Event, also messen wir selbst — rund 600 ms,
  // das deckt Öffnen wie Schließen ab.
  function kbVerfolgen(dauerMs){
    kbLoopBis = Math.max(kbLoopBis, performance.now() + (dauerMs || 600));
    if (kbLoopId) return;
    const schritt = () => {
      kbMessen();
      if (performance.now() < kbLoopBis){
        kbLoopId = requestAnimationFrame(schritt);
      } else {
        kbLoopId = 0;
        kbMessen();
      }
    };
    kbLoopId = requestAnimationFrame(schritt);
  }

  function setVH(){
    basisSetzen();
    kbMessen(true);
  }

  basisSetzen();
  kbMessen(true);

    }).catch(e => { audioDbPromise = null; throw e; });

  }

      tx.onabort = () => reject(tx.error || new Error('tx abgebrochen'));
      tx.onerror = () => reject(tx.error || new Error('tx fehlgeschlagen'));
      if (req) req.onsuccess = () => resolve(req.result);
      else tx.oncomplete = () => resolve(undefined);
    }));

  function urlBase64ToUint8Array(base64String){

    const rawData = atob(base64);

  function escapeHtml(str){

    // Lookahead (?![a-zA-Z]) verhindert Fehltreffer wie "50EUR" oder "5Minuten" -
    // nur ein einzelner Buchstabe E/M direkt nach Ziffern, nicht gefolgt von
    // einem weiteren Buchstaben, zaehlt als Ortsmarkierung.
    return escaped.replace(/(\d+)([EM])(?![a-zA-Z])/g, function(_, zahl, ort){
      const farbe = ort === 'E' ? 'var(--essen)' : 'var(--muelheim)';
      return '<span style="color:' + farbe + '">' + zahl + '</span>';
    });
  }

  const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
  const pauseIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  function buildVoicePlayer(blobUrl, peaks){
    const container = document.createElement('div');
    container.className = 'voice-player';

    const playBtn = document.createElement('button');
    playBtn.className = 'voice-play-btn';
    playBtn.type = 'button';
    playBtn.innerHTML = playIcon;
    playBtn.setAttribute('aria-label', 'Abspielen');

    const waveEl = document.createElement('div');
    waveEl.className = 'voice-wave';
    const bars = (peaks && peaks.length ? peaks : new Array(32).fill(0.4)).map(p => {
      const bar = document.createElement('span');
      bar.style.height = Math.max(3, p * 26) + 'px';
      waveEl.appendChild(bar);
      return bar;
    });

    const durationEl = document.createElement('span');
    durationEl.className = 'voice-duration';
    durationEl.textContent = '0:00';

    const audio = new Audio(blobUrl);
    audio.preload = 'metadata';

    // WebM-Aufnahmen aus MediaRecorder melden anfangs oft duration=Infinity,
    // weil der Browser die Gesamtlänge nicht aus den Metadaten lesen kann.
    // Fix: kurz ans Ende springen, das erzwingt die echte Berechnung.
    function resolveDuration(){
      if (isFinite(audio.duration) && audio.duration > 0){
        durationEl.textContent = formatDuration(audio.duration);
        return;
      }
      const onDurationChange = () => {
        if (isFinite(audio.duration) && audio.duration > 0){
          audio.removeEventListener('durationchange', onDurationChange);
          durationEl.textContent = formatDuration(audio.duration);
          audio.currentTime = 0;
        }
      };
      audio.addEventListener('durationchange', onDurationChange);
      audio.currentTime = 1e101;
    }

    audio.addEventListener('loadedmetadata', resolveDuration);

    function setProgress(frac){
      const activeCount = Math.round(frac * bars.length);
      bars.forEach((b, i) => b.classList.toggle('played', i < activeCount));
    }

    audio.addEventListener('play', () => { playBtn.innerHTML = pauseIcon; });
    audio.addEventListener('pause', () => { playBtn.innerHTML = playIcon; });
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = playIcon;
      setProgress(0);
      if (isFinite(audio.duration)) durationEl.textContent = formatDuration(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!isFinite(audio.duration) || audio.duration === 0) return;
      setProgress(audio.currentTime / audio.duration);
      durationEl.textContent = formatDuration(audio.duration - audio.currentTime);
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused){
        document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
        audio.play();
      } else {
        audio.pause();
      }
    });

    waveEl.addEventListener('click', (e) => {
      const rect = waveEl.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      if (isFinite(audio.duration)) audio.currentTime = frac * audio.duration;
    });

    container.appendChild(playBtn);
    container.appendChild(waveEl);
    container.appendChild(durationEl);
    // Das Audio-Objekt selbst haengt nicht im DOM. Damit die Blob-URL beim
    // Entfernen der Blase trotzdem freigegeben werden kann, wird sie hier
    // am sichtbaren Element vermerkt.
    container.dataset.nxUrl = blobUrl;
    return container;
  }

  async function computeWaveformPeaks(blob, numBars){
    try{
      const arrayBuffer = await blob.arrayBuffer();
      const OfflineCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new OfflineCtx();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
      const rawData = audioBuffer.getChannelData(0);
      const blockSize = Math.max(1, Math.floor(rawData.length / numBars));
      const peaks = [];
      for (let i = 0; i < numBars; i++){
        const start = i * blockSize;
        let sum = 0;
        for (let j = 0; j < blockSize; j++){
          sum += Math.abs(rawData[start + j] || 0);
        }
        peaks.push(sum / blockSize);
      }
      const max = Math.max(...peaks) || 1;
      ctx.close();
      return peaks.map(p => Math.max(0.12, p / max));
    }catch(err){
      return Array.from({ length: numBars }, () => 0.2 + Math.random() * 0.7);
    }
  }

  // ── Sprachaufnahme ──────────────────────────────────────
  async function startRecording(){
    try{
      // Fuer jede Aufnahme einen frischen Stream anfragen und danach
      // wieder sauber stoppen (siehe stopRecording unten). Ein frueherer
      // Versuch, den Stream ueber mehrere Aufnahmen hinweg offenzuhalten,
      // um die iOS-Mikrofon-Bestaetigung zu sparen, hat in der Praxis
      // nichts gebracht (iOS fragt bei dieser Web-App ohnehin bei jeder
      // Aufnahme neu) - stattdessen aber dafuer gesorgt, dass eine
      // Aufnahme nach einer Unterbrechung (App im Hintergrund, Sperr-
      // bildschirm) lautlos blieb, weil iOS den alten Track dabei stumm-
      // geschaltet hatte (readyState blieb "live", aber muted=true) und
      // gleichzeitig das Mikrofon-Symbol faelschlich weiter "an" zeigte.
      // Ein frischer Stream pro Aufnahme + sauberes Stoppen danach ist
      // zuverlaessiger und raeumt das Mikrofon-Symbol zwischen den
      // Aufnahmen zuverlaessig weg.
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(err){
      showError("Mikrofonzugriff verweigert oder nicht verfügbar.");
      return;
    }

    audioChunks = [];
    discardOnStop = false;
    const mimeType = MediaRecorder.isTypeSupported('audio/webm')
      ? 'audio/webm'
      : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    mediaRecorder.addEventListener('dataavailable', e => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });

    mediaRecorder.addEventListener('stop', async () => {
      if (discardOnStop){
        audioBlob = null;
        audioPeaks = null;
        if (recordingStopResolve){ recordingStopResolve(); recordingStopResolve = null; }
        return;
      }

      audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      audioPeaks = await computeWaveformPeaks(audioBlob, 32);
      const blobUrl = merkeUrl(URL.createObjectURL(audioBlob));
      attachmentPreview.innerHTML = '';
      attachmentPreview.appendChild(buildVoicePlayer(blobUrl, audioPeaks));
      attachmentChip.classList.add('show');

      if (recordingStopResolve){ recordingStopResolve(); recordingStopResolve = null; }
    });

    mediaRecorder.start();
    isRecording = true;
    seconds = 0;
    liveLevels = new Array(LIVE_BARS).fill(0.06);
    renderLiveWave();

    // Live-Analyser für die Wellenform während der Aufnahme
    liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = liveAudioCtx.createMediaStreamSource(stream);
    liveAnalyser = liveAudioCtx.createAnalyser();
    liveAnalyser.fftSize = 256;
    source.connect(liveAnalyser);
    liveDataArray = new Uint8Array(liveAnalyser.fftSize);
    lastSampleTime = 0;
    liveRafId = requestAnimationFrame(liveWaveTick);

    recBtn.classList.add('recording');
    recBtn.setAttribute('aria-label', 'Aufnahme stoppen');
    cancelRecBtn.classList.add('show');
    notesWrap.classList.add('recording');
    recLiveTime.textContent = '0:00';

    timerInterval = setInterval(() => {
      seconds += 1;
      recLiveTime.textContent = formatDuration(seconds);
    }, 1000);
  }

  function stopRecording(){
    return new Promise((resolve) => {
      // Notbremse: feuert der Recorder sein "stop"-Event nicht (kommt auf
      // aelteren iOS-Versionen vor), haengt das Senden sonst fuer immer.
      let notbremse = setTimeout(() => {
        notbremse = null;
        if (recordingStopResolve){ recordingStopResolve = null; resolve(); }
      }, 3000);

      recordingStopResolve = () => {
        if (notbremse){ clearTimeout(notbremse); notbremse = null; }
        resolve();
      };

      if (mediaRecorder && mediaRecorder.state !== 'inactive'){
        mediaRecorder.stop();
      } else {
        recordingStopResolve = null;
        if (notbremse){ clearTimeout(notbremse); notbremse = null; }
        resolve();
      }

      clearInterval(timerInterval);
      cancelAnimationFrame(liveRafId);
      if (liveAudioCtx){ liveAudioCtx.close(); liveAudioCtx = null; }
      // Mikrofon-Tracks sofort freigeben statt erst beim Verlassen der App -
      // sonst zeigt iOS das Mikrofon-Symbol faelschlich weiter "an", obwohl
      // gar nicht mehr aufgenommen wird.
      if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
      isRecording = false;

      recBtn.classList.remove('recording');
      recBtn.setAttribute('aria-label', 'Sprachnachricht aufnehmen');
      cancelRecBtn.classList.remove('show');
      notesWrap.classList.remove('recording');
    });
  }

  function createStarfield(container, count){
    container.innerHTML = '';
    const accentColors = ['rgba(91,110,245,0.95)', 'rgba(140,92,255,0.95)', 'rgba(52,216,196,0.95)'];
    for (let i = 0; i < count; i++){
      const star = document.createElement('span');
      star.className = 'star';

      const isNode = Math.random() < 0.12;
      const size = isNode ? 3 + Math.random() * 2 : 1 + Math.random() * 1.8;
      const color = isNode
        ? accentColors[Math.floor(Math.random() * accentColors.length)]
        : 'rgba(255,255,255,0.95)';

      const top = Math.random() * 100;
      const left = Math.random() * 100;
      const dx = (Math.random() * 16 - 8).toFixed(1);
      const dy = (Math.random() * 16 - 8).toFixed(1);
      const dur = 14 + Math.random() * 26;
      const tw = 2 + Math.random() * 5;
      const opMin = 0.15 + Math.random() * 0.15;
      const opMax = 0.55 + Math.random() * 0.4;

      // Glow frueher als animierter box-shadow — der teuerste Effekt der
      // Datei. Jetzt steckt das Leuchten als radial-gradient direkt im
      // Hintergrund: gleiche Optik, aber der Compositor muss pro Frame
      // nichts mehr neu berechnen.
      const glow = isNode ? size * 4.2 : size * 2.6;
      const kern = ((size / glow) * 50).toFixed(1);
      star.style.top = top + '%';
      star.style.left = left + '%';
      star.style.width = glow + 'px';
      star.style.height = glow + 'px';
      star.style.marginTop = (-glow / 2) + 'px';
      star.style.marginLeft = (-glow / 2) + 'px';
      star.style.background =
        `radial-gradient(circle, ${color} 0%, ${color} ${kern}%, ` +
        `${color.replace(/[\d.]+\)$/, '0.28)')} ${Number(kern) * 2}%, transparent 68%)`;
      star.style.setProperty('--dx', dx + 'vw');
      star.style.setProperty('--dy', dy + 'vh');
      star.style.setProperty('--dur', dur + 's');
      star.style.setProperty('--tw', tw + 's');
      star.style.setProperty('--op-min', opMin);
      star.style.setProperty('--op-max', opMax);
      star.style.animationDelay = `-${(Math.random() * dur).toFixed(1)}s, -${(Math.random() * tw).toFixed(1)}s`;

      container.appendChild(star);
    }
  }

  // ── "Gummiband"-Effekt für den Chatverlauf (wie bei WhatsApp) ──────
  // Wenn noch nicht genug Nachrichten da sind, um wirklich zu scrollen,
  // passierte bisher beim Ziehen gar nichts — das wirkte kaputt. Jetzt
  // bewegt sich der Inhalt beim Ziehen sanft und gedämpft mit und
  // federt danach weich in die Ausgangsposition zurück.
  (function initChatRubberBand(){
    if (!chat) return;
    let startY = 0;
    let dragging = false;

    function canNativeScroll(){
      return chat.scrollHeight > chat.clientHeight + 1;
    }

    chat.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1 || canNativeScroll()) return;
      startY = e.touches[0].clientY;
      dragging = true;
      chat.style.transition = 'none';
    }, { passive: true });

    chat.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const y = e.touches[0].clientY;
      const deltaY = y - startY;
      // Widerstand: je weiter gezogen wird, desto weniger folgt die Bewegung
      const resisted = Math.sign(deltaY) * Math.min(Math.abs(deltaY) * 0.38, 46);
      chat.style.transform = `translateY(${resisted}px)`;
      e.preventDefault();
    }, { passive: false });

    function releaseRubberBand(){
      if (!dragging) return;
      dragging = false;
      chat.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1)';
      chat.style.transform = 'translateY(0)';
    }

    chat.addEventListener('touchend', releaseRubberBand, { passive: true });
    chat.addEventListener('touchcancel', releaseRubberBand, { passive: true });
  })();

  // Zusätzliche Sterne gezielt im unteren Sicherheitsbereich (Home-Indicator-
  // Zone) platzieren, damit dieser Streifen nie zufällig leer/flach aussieht
  // und optisch nahtlos in den restlichen Sternenhimmel übergeht.
  (function addBottomSafeAreaStars(){
    const extra = document.createElement('div');
    extra.style.position = 'absolute';
    extra.style.left = '0'; extra.style.right = '0'; extra.style.bottom = '0';
    extra.style.height = '6%';

    createStarfield(extra, istSchmal ? 4 : 6);
  })();

  // ── Intro-Sequenz: Explosion, aus der die App direkt entsteht ──
  (function runIntro(){
    const introOverlay = document.getElementById('introOverlay');
    const introBg = document.getElementById('introBg');
    const introCore = document.getElementById('introCore');
    const appEl = document.querySelector('.app');
    const headerEl = document.querySelector('.header');
    const composerWrapEl = document.querySelector('.composer-wrap');
    if (!introOverlay || !appEl) return;

    // Explosionszentrum exakt auf die Position des echten Empty-State-Logos legen,
    // damit Logo/Blitz nahtlos an derselben Stelle ineinander übergehen.
    const logoEl = emptyState ? emptyState.querySelector('.logo-mark') : null;
    const logoRect = logoEl ? logoEl.getBoundingClientRect() : null;
    const cx = logoRect ? logoRect.left + logoRect.width / 2 : window.innerWidth / 2;
    const cy = logoRect ? logoRect.top + logoRect.height / 2 : window.innerHeight / 2;

    if (introCore){
      introCore.style.left = cx + 'px';
      introCore.style.top = cy + 'px';
    }

    const particles = [];
    const count = 46;

    for (let i = 0; i < count; i++){
      const p = document.createElement('span');
      p.className = 'intro-particle';
      const targetX = Math.random() * window.innerWidth;
      const targetY = Math.random() * window.innerHeight;
      const size = 1.5 + Math.random() * 2.6;
      const isAccent = Math.random() < 0.25;
      const color = isAccent
        ? ['#5b6ef5', '#8c5cff', '#34d8c4'][Math.floor(Math.random() * 3)]
        : '#ffffff';
      const targetOpacity = (0.4 + Math.random() * 0.5).toFixed(2);

      // Start: gebündelt im Zentrum, unsichtbar, winzig
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = color;
      p.style.boxShadow = `0 0 ${size * 3}px ${color}`;
      p.style.opacity = '0';
      p.style.transform = 'translate(0, 0) scale(0.2)';
      p.style.transitionDuration = (900 + Math.random() * 500) + 'ms';

      introOverlay.appendChild(p);
      particles.push({
        el: p,
        dx: targetX - cx,
        dy: targetY - cy,
        opacity: targetOpacity
      });
    }

    // Phase 1: Kern lädt auf
    introOverlay.classList.add('charging');

    // Phase 2: Explosion — Kern-Blitz + Partikel fliegen nach außen,
    // gleichzeitig beginnt der dunkle Hintergrund-Layer zu verblassen
    setTimeout(() => {
      introOverlay.classList.remove('charging');
      introOverlay.classList.add('burst');
      if (introBg) introBg.classList.add('hide');

      particles.forEach(({ el, dx, dy, opacity }) => {
        el.style.transitionDelay = Math.round(Math.random() * 90) + 'ms';
        el.style.transform = `translate(${dx}px, ${dy}px) scale(1)`;
        el.style.opacity = opacity;
      });
    }, 620);

    // Phase 3: Mitten im hellen Blitz stehen Logo + Name schon da —
    // es wirkt, als würden sie aus dem Licht entstehen
    setTimeout(() => {
      if (headerEl) headerEl.classList.add('show');
      if (emptyState) emptyState.classList.add('show');
    }, 760);

    // Phase 4: Kurz danach fährt die Eingabeleiste dynamisch hoch
    setTimeout(() => {
      if (composerWrapEl) composerWrapEl.classList.add('show');
      appEl.classList.add('ready');
    }, 1280);

    // Phase 5: Partikel lösen sich sanft auf, statt abrupt zu verschwinden
    setTimeout(() => {
      particles.forEach(({ el }, i) => {
        el.style.transitionDuration = '650ms';
        el.style.transitionDelay = Math.round(i * 4) + 'ms';
        el.style.opacity = '0';
      });
    }, 1750);

    // Phase 6: Overlay endgültig entfernen (Partikel sind bereits ausgeblendet)
    setTimeout(() => {
      introOverlay.remove();
      particles.length = 0;
    }, 2550);
  })();

  function burstParticles(button){

  // ── Senden ──────────────────────────────────────────────
  async function handleSend(){
    const text = notesEl.value.trim();
    if (!text && !audioBlob) return;

    sendBtn.disabled = true;
    burstParticles(sendBtn);
    pulseAmbient();

    let outgoingAudioUrl = null;
    if (audioBlob) outgoingAudioUrl = merkeUrl(URL.createObjectURL(audioBlob));
    const peaksToSend = audioPeaks;

    const sentTicks = [];
    if (text){
      const { ticks } = addTextBubble(text, 'out');
      sentTicks.push(ticks);
      appendToChatHistory({ type: 'text', direction: 'out', text, ts: Date.now() });
    }
    if (outgoingAudioUrl){
      const { ticks } = addVoiceBubble(outgoingAudioUrl, peaksToSend, 'out');
      sentTicks.push(ticks);
      const audioKey = 'a-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      try{
        await audioSpeichern(audioKey, audioBlob);
        appendToChatHistory({ type: 'audio', direction: 'out', audioKey, peaks: peaksToSend, ts: Date.now() });
      }catch(e){
        // IndexedDB nicht verfuegbar (z.B. privater Modus): auf den alten
        // Base64-Weg zurueckfallen, damit der Verlauf trotzdem haelt.
        try{
          const audioDataUrl = await blobToBase64(audioBlob);
          appendToChatHistory({ type: 'audio', direction: 'out', audioDataUrl, peaks: peaksToSend, ts: Date.now() });
        }catch(e2){
          // Dann eben nur in dieser Sitzung sichtbar — der Versand
          // selbst ist davon nicht betroffen.
        }
      }
    }

    // Anfrage-Body: session_id (stabil pro Nutzer/Gerät), Zeitstempel,
    // optionaler Freitext und die Sprachnachricht als Binärdatei.
    // Audio kann nur binär/multipart übertragen werden — deshalb FormData
    // statt reinem JSON, session_id/timestamp/notes laufen als Textfelder mit.
    const formData = new FormData();
    formData.append('session_id', SESSION_ID);
    formData.append('timestamp', new Date().toISOString());
    formData.append('notes', text);
    // Kundencode mitschicken, damit Fehlermeldungen nur an das
    // verursachende Geraet gehen (Push-Zuordnung in Make).
    formData.append('kunde_code', (typeof window.getKundenCode === 'function' ? (window.getKundenCode() || '') : ''));
    if (audioBlob){
      const mime = audioBlob.type || 'audio/webm';
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const filename = `sprachnachricht.${ext}`;
      formData.append('audio', audioBlob, filename);
      formData.append('audio_name', filename);
      formData.append('audio_mime', mime);
    }

    notesEl.value = '';
    if (hoehenFrame){ cancelAnimationFrame(hoehenFrame); hoehenFrame = 0; }
    notesEl.style.height = 'auto';
    letzteHoehe = -1;
    audioBlob = null;
    audioPeaks = null;
    attachmentChip.classList.remove('show');
    attachmentPreview.innerHTML = '';

    let typingRow = null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), WEBHOOK_TIMEOUT_MS);

    try{
      typingRow = addTypingBubble();
      sendToN8nFireAndForget(formData);

      // Synchron auf die Antwort von Make warten — kein separater Kanal
      // (z.B. Telegram) mehr, die Rückmeldung kommt direkt im Response-Body.
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: formData,
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!response.ok){
        throw new Error(`Status ${response.status}`);
      }

      sentTicks.forEach(confirmTicks);
      pulseAmbient();

      // Erwartetes Format: { "reply": "<Text>", "format"?: "tabelle" }
      // "format" kommt nur bei listenartigen Antworten (z. B. Trainingsplan-
      // Uebersicht) mit - steuert, ob Zeilen im Chat nicht umbrechen duerfen
      // (siehe bubbleZeilenAufbauen in nexus-sync.js). Normaler Text bleibt
      // ohne dieses Feld und bricht ganz gewoehnlich um.
      const data = await response.json();
      const replyText = data && typeof data.reply === 'string' ? data.reply.trim() : '';
      const replyFormat = data && typeof data.format === 'string' ? data.format : undefined;

      if (typingRow) typingRow.remove();
      typingRow = null;

      if (replyText){
        addTextBubble(replyText, 'in', undefined, replyFormat);
        appendToChatHistory({ type: 'text', direction: 'in', text: replyText, ts: Date.now(), format: replyFormat });
      }

    }catch(err){
      clearTimeout(timeoutId);
      if (typingRow) typingRow.remove();
      showError("Verarbeitung fehlgeschlagen, bitte erneut versuchen.");
    }finally{
      sendBtn.disabled = false;
    }
  }

  // Vorherige Version: preventDefault auf touchstart hielt zwar die
  // Tastatur offen, unterdrueckt auf iOS/vielen mobilen Browsern aber
  // gleichzeitig das nachfolgende synthetische "click"-Event, an dem
  // das eigentliche Senden haengt - der Button reagierte dadurch kaum
  // noch. Fix: EIN pointerdown-Handler statt mousedown+touchstart+click.
  // pointerdown feuert sofort bei Beruehrung (kein Warten auf touchend),
  // preventDefault darauf verhindert weiterhin den Fokuswechsel/das
  // Tastatur-Zuklappen, und die Sende-Logik haengt direkt mit dran -
  // kein separates click-Event mehr noetig, das verschluckt werden koennte.
  sendBtn.addEventListener('pointerdown', async (ev) => {
    ev.preventDefault();
    if (sendBtn.disabled) return;
    if (isRecording){
      await stopRecording();
    }
    handleSend();
  });

  // Gespeicherten Chatverlauf (bis 48 Std. alt) beim Start wiederherstellen
  const chatRestored = restoreChatHistory();

  // ── Push-Nachrichten in den Chat einspeisen ─────────────────
  // Der Service Worker meldet jede eingehende Push-Nachricht hierher.
  // Ist die App offen, erscheint sie sofort als Bubble. War die App zu,
  // liefert der Service Worker sie beim naechsten Oeffnen nach.
  // Jede eingespeiste Nachricht wandert zusaetzlich in den 48-Std-Verlauf.
  (function initPushInbox(){
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js').catch(() => {});

    const seen = new Set();

    function show(item){
      if (!item) return;
      const text = item.body || item.title || '';
      if (!text) return;
      const key = item.id || (text + '|' + (item.ts || ''));
      if (seen.has(key)) return;
      seen.add(key);
      addTextBubble(text, 'in', item.ts ? new Date(item.ts) : undefined);
      appendToChatHistory({ type: 'text', direction: 'in', text: text, ts: item.ts || Date.now() });
    }

    navigator.serviceWorker.addEventListener('message', (event) => {
      const msg = event.data || {};
      if (msg.type === 'nexus-push') show(msg.payload);
      if (msg.type === 'nexus-drain-result') (msg.items || []).forEach(show);
    });

    async function drain(){
      try{
        const reg = await navigator.serviceWorker.ready;
        const target = (reg && reg.active) || navigator.serviceWorker.controller;
        if (!target) return;
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => {
          const msg = e.data || {};
          if (msg.type === 'nexus-drain-result') (msg.items || []).forEach(show);
        };
        target.postMessage({ type: 'nexus-drain' }, [ch.port2]);
      }catch(e){ /* ignorieren */ }
    }

    // Erst den gespeicherten Verlauf aufbauen, dann geparkte Pushes anhaengen,
    // damit die Reihenfolge im Chat stimmt.
    // Mehrfach nachfassen: Tippt der Nutzer direkt auf die Push-Meldung,
    // ist die App u. U. schneller offen, als der Service Worker die
    // Nachricht abgelegt hat. Doppelte faengt das seen-Set ab.
    function drainRepeatedly(){
      drain();
      [800, 2500, 6000].forEach((ms) => setTimeout(drain, ms));
    }

    Promise.resolve(chatRestored).catch(() => {}).then(drainRepeatedly);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') drainRepeatedly();
    });

    // ── Manueller Refresh-Button ─────────────────────────────
    // Fragt beim Service Worker nach geparkten Push-Nachrichten UND stoesst
    // (falls nexus-sync.js geladen ist) einen vollen Geraete-Abgleich mit
    // dem Server an - siehe window.nexusResync in nexus-sync.js. Vorher
    // hat der Button NUR den Push-Pfad abgefragt: eine Antwort, die zwar
    // schon serverseitig/im gespeicherten Verlauf stand (z. B. weil sie
    // ueber ein anderes Geraet kam oder der direkte Webhook-Reply aus
    // irgendeinem Grund nicht live gerendert wurde), aber nie als Push
    // hier ankam, blieb dadurch unsichtbar bis zum kompletten Neustart der
    // App. Kein volles location.reload() noetig, dafuer bleiben
    // Composer-Inhalt und App-Zustand unangetastet.
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn){
      let refreshLaeuft = false;
      refreshBtn.addEventListener('click', () => {
        if (refreshLaeuft) return;
        refreshLaeuft = true;
        refreshBtn.classList.add('loading');
        refreshBtn.disabled = true;
        drainRepeatedly();

        // Mindestdauer, damit der Spin auch sichtbar ist, wenn alles
        // (mangels neuer Nachrichten) quasi sofort durch ist — sonst
        // wirkt der Klick wie ein Nicht-Reagieren. Der eigentliche Abgleich
        // wird aber tatsaechlich abgewartet (nicht nur die Mindestdauer),
        // sonst waere ein langsamer Sync schon "fertig", bevor er es ist.
        const mindestens = new Promise(r => setTimeout(r, 650));
        const abgleich = (typeof window.nexusResync === 'function')
          ? Promise.resolve(window.nexusResync()).catch(() => {
              showError("Aktualisieren nicht vollständig — bitte erneut versuchen.");
            })
          : Promise.resolve();

        Promise.all([abgleich, mindestens]).then(() => {
          refreshBtn.classList.remove('loading');
          refreshBtn.disabled = false;
          refreshLaeuft = false;
        });
      });
    }
  })();
</script>
<script src="/nexus-sync.js"></script>

</body>
